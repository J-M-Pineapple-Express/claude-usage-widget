<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>Auto Continue activity</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <main>
    <h1>Auto Continue <span id="state" class="pill"></span></h1>
    <p class="sub" id="agents-mode"></p>

    <h2>Last check</h2>
    <div class="block" id="check"></div>

    <h2>Waiting to send</h2>
    <div id="pending"></div>

    <h2>Recently sent</h2>
    <div id="history"></div>

    <p class="hint">Checks run every minute, right after the usage numbers refresh.</p>
  </main>
  <script src="panel-util.js"></script>
  <script src="activity.js"></script>
</body>
</html>
