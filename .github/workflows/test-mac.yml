name: macOS Auto Continue tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mac-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build unpacked app
        run: npx electron-builder --mac dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Auto Continue smoke test
        run: node test/mac-smoke.js "dist/mac-arm64/Claude Usage.app"
